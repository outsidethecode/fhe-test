[package]
name = "lacore"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "mobile"
path = "src/mobile.rs"

[[bin]]
name = "agent"
path = "src/agent.rs"

[[bin]]
name = "test"
path = "src/test.rs"

[dependencies]
rocket = "0.4.5"
rocket_codegen = "0.4.5"
diesel = { version = "1.4.4", features = ["postgres"] }
dotenv = "0.15.0"
r2d2-diesel = "1.0.0"
r2d2 = "0.8.9"
serde = "1.0.116"
serde_derive = "1.0.116"
serde_json = "1.0.58"
env_logger = "0.10.0"
log = "0.4.6"
rand = "0.8.5"
# tfhe = { version = "*", features = ["boolean", "shortint", "integer", "x86_64-unix"] }
secp256k1 = "0.27.0"
# hex = "0.4.3"
# byteorder = "1.4.3"
ecies = {version = "0.2", features = ["std"]}
num-bigint = "0.4"
sunscreen = "*"
# serde = { version = "1.0", features = ["derive"] }
# serde_json = "1.0"
libsecp256k1 = "0.7.1"
reqwest = { version = "0.11", features = ["json"] } # reqwest with JSON parsing support
futures = "0.3" # for our async / await blocks
tokio = { version = "1.12.0", features = ["full"] } # for our async runtime
flate2="1.0.27"
lazy_static = "1.4"
# postgres="0.19.7"
# diesel = { version = "2.1.2", features = ["postgres"] }
dotenvy = "0.15"
# r2d2-diesel = "1.0.0"
# r2d2 = "0.8.9"
# serde_derive = "1.0.116"
# env_logger = "0.10.0"
# log = "0.4.6"

[dependencies.rocket_contrib]
version = "*"
default-features = false
features = ["json", "handlebars_templates"]

[dev-dependencies]
bencher = "0.1.5"