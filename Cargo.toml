[package]
name = "fhetest"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "0.8.5"
modinverse = "0.1.1"
Cupcake = "0.2.1"
rsa = "0.9.2"
tfhe = { version = "*", features = ["boolean", "shortint", "integer", "x86_64-unix"] }
secp256k1 = "0.27.0"
hex = "0.4.3"
byteorder = "1.4.3"
ecies = {version = "0.2", features = ["std"]}
num-bigint = "0.4"
sunscreen = "*"
serde = "1.0"
serde_json = "1.0"
libsecp256k1 = "0.7.1"
crypto_box="0.9.1"
curve25519-dalek = "4.1.1"

[dev-dependencies]
bencher = "0.1.5"